<body>

  <!-- Navigation Bar (without search elements) -->

      <span>TravelBloom</span>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about_us.html">About Us</a></li>

  <main class="page-container">
    <h1>Contact Us</h1>
    <p>
      Have questions, suggestions, or want to collaborate with our travel curation team?
      Send us a message below and we will get back to you within 24 hours.
    </p>

    <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you for reaching out! Your message has been received.'); this.reset();">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email Address" required>
      <textarea placeholder="Your Message or Inquiry..." required></textarea>
      <button type="submit">Submit Message</button>
    </form>
  </main>

</body>
